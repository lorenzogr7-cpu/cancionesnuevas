<script>
  // =============================================
  // CONFIGURACIÓN DE SUPABASE
  // =============================================
  const SUPABASE_URL = 'https://bwgwxyawlnjlyrtuzupu.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3Z3d4eWF3bG5qbHlydHV6dXB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTYwNzAsImV4cCI6MjEwNTU3MjA3MH0.tTSIg5FXCX8U5u55Ht9PT5BB0BWSYLJzIVhKHUwEsJY';

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const CUPO_MAX = 40;
  const TABLE = 'anotados';

  // ===== ELEMENTOS =====
  const playBtn = document.getElementById('playBtn');
  const cdLogo = document.getElementById('cdLogo');
  const formOverlay = document.getElementById('formOverlay');
  const adminOverlay = document.getElementById('adminOverlay');
  const signupForm = document.getElementById('signupForm');
  const successMsg = document.getElementById('successMsg');
  const adminList = document.getElementById('adminList');
  const adminTotal = document.getElementById('adminTotal');
  const submitBtn = document.getElementById('submitBtn');
  const copyBtn = document.getElementById('copyBtn');
  const clearBtn = document.getElementById('clearBtn');

  // ===== CONTADOR INTERNO (no visible) =====
  async function actualizarContador() {
    const { count, error } = await db
      .from(TABLE)
      .select('*', { count: 'exact', head: true });

    if (error) {
      console.error('Error contador:', error);
      return;
    }

    const total = count || 0;
    const restantes = CUPO_MAX - total;

    if (restantes <= 0) {
      submitBtn.disabled = true;
      submitBtn.textContent = 'Cupo completo';
    } else {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Anotarme';
    }
  }

  // ===== ABRIR / CERRAR MODALES =====
  function abrirOverlay(el) {
    el.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function cerrarOverlays() {
    document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
    document.body.style.overflow = '';
  }

  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', cerrarOverlays);
  });

  document.querySelectorAll('.overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) cerrarOverlays();
    });
  });

  // ===== BOTÓN PLAY =====
  playBtn.addEventListener('click', async () => {
    try {
      const { count, error } = await db.from(TABLE).select('*', { count: 'exact', head: true });
      if (error) console.error('Error consultando cupo:', error);

      if ((count || 0) >= CUPO_MAX) {
        alert('El cupo está completo. ¡Gracias por el interés!');
        return;
      }

      successMsg.style.display = 'none';
      signupForm.style.display = 'block';
      actualizarContador();
      abrirOverlay(formOverlay);
    } catch (err) {
      console.error(err);
      // Aún si falla Supabase, abrimos el form
      successMsg.style.display = 'none';
      signupForm.style.display = 'block';
      abrirOverlay(formOverlay);
    }
  });

  // ===== FORMULARIO =====
  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const datos = {
      nombre: document.getElementById('nombre').value.trim(),
      apellido: document.getElementById('apellido').value.trim(),
      celular: document.getElementById('celular').value.trim(),
      instagram: document.getElementById('instagram').value.trim(),
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';

    const { error } = await db.from(TABLE).insert([datos]);

    if (error) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Anotarme';

      if (error.code === '23505') {
        alert('Ese celular ya está anotado.');
      } else {
        alert('Hubo un error: ' + error.message);
        console.error(error);
      }
      return;
    }

    signupForm.reset();
    signupForm.style.display = 'none';
    successMsg.style.display = 'block';
    await actualizarContador();

    setTimeout(() => {
      cerrarOverlays();
      signupForm.style.display = 'block';
      successMsg.style.display = 'none';
    }, 3500);
  });

  // ===== LOGO SECRETO: 13 CLICS =====
  let clickCount = 0;
  let clickTimer = null;

  cdLogo.addEventListener('click', () => {
    clickCount++;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => { clickCount = 0; }, 2000);

    if (clickCount >= 13) {
      clickCount = 0;
      clearTimeout(clickTimer);
      cargarAdmin();
      abrirOverlay(adminOverlay);
    }
  });

  // ===== CARGAR PANEL ADMIN =====
  async function cargarAdmin() {
    adminList.innerHTML = '<div class="loading-text">Cargando...</div>';

    const { data, error } = await db
      .from(TABLE)
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      adminList.innerHTML = '<div class="admin-empty">Error al cargar</div>';
      console.error(error);
      return;
    }

    adminTotal.textContent = data.length;

    if (data.length === 0) {
      adminList.innerHTML = '<div class="admin-empty">Todavía no hay anotados</div>';
      return;
    }

    adminList.innerHTML = data.map((a, i) => `
      <div class="admin-item">
        <strong>${i + 1}. ${escapeHtml(a.nombre)} ${escapeHtml(a.apellido)}</strong>
        <small>📱 ${escapeHtml(a.celular)} · 📷 ${escapeHtml(a.instagram)}</small>
        <small style="color:#555;">${new Date(a.created_at).toLocaleString('es-AR')}</small>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // ===== COPIAR =====
  copyBtn.addEventListener('click', async () => {
    const { data } = await db.from(TABLE).select('*').order('created_at', { ascending: false });
    if (!data || data.length === 0) {
      alert('No hay datos para copiar');
      return;
    }
    const texto = data.map((a, i) =>
      `${i + 1}. ${a.nombre} ${a.apellido} | ${a.celular} | ${a.instagram}`
    ).join('\n');

    try {
      await navigator.clipboard.writeText(texto);
      copyBtn.textContent = '¡Copiado!';
      setTimeout(() => copyBtn.textContent = 'Copiar datos', 1500);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = texto;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copyBtn.textContent = '¡Copiado!';
      setTimeout(() => copyBtn.textContent = 'Copiar datos', 1500);
    }
  });

  // ===== VACIAR =====
  clearBtn.addEventListener('click', async () => {
    if (!confirm('¿Seguro que querés borrar TODOS los anotados?')) return;

    const { error } = await db.from(TABLE).delete().neq('id', '00000000-0000-0000-0000-000000000000');

    if (error) {
      alert('Error al borrar: ' + error.message);
      return;
    }

    await actualizarContador();
    cargarAdmin();
  });

  // ===== INIT =====
  actualizarContador();
</script>
